name: human
on:
  push:
    paths: ["human/**", ".github/workflows/human.yml"]
  pull_request:
    paths: ["human/**", ".github/workflows/human.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m arcade_human validate samples/arcade_human_sample
      - run: pytest -q
